name: Rangyuu CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest .

      - name: Compile Python sources
        run: python -m compileall -q rangyuu tests

      - name: Run tests
        run: python -m pytest -q
