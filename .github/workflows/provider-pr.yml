name: provider-pr
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: python -m pytest -q
