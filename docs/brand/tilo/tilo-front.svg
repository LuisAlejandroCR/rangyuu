<!-- tilo-front.svg: Tilo, mascota decorativa de Rangyuu, en vista frontal.
     Tres capas de ficha de mapa plegada, aletas laterales, brazos cortos y ojos iguales.
     Sin scripts, filtros ni recursos externos; el contorno oscuro sostiene el contraste en fondos claros. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" role="img" aria-labelledby="tilo-front-title">
  <title id="tilo-front-title">Tilo, mascota decorativa de Rangyuu</title>
  <defs>
    <linearGradient id="tilo-front-lav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6a9d2"/>
      <stop offset="1" stop-color="#9c8dbd"/>
    </linearGradient>
    <linearGradient id="tilo-front-lav-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a090c0"/>
      <stop offset="1" stop-color="#87789f"/>
    </linearGradient>
    <linearGradient id="tilo-front-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e5"/>
      <stop offset="1" stop-color="#eadfca"/>
    </linearGradient>
  </defs>

  <g stroke="#4b3f60" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- aletas laterales: ahusadas hacia arriba, con nervios, para que no se lean como ruedas -->
    <path d="M38 122 C26 114 14 104 7 106 C3 117 16 140 38 154 Z" fill="url(#tilo-front-lav-deep)"/>
    <path d="M202 122 C214 114 226 104 233 106 C237 117 224 140 202 154 Z" fill="url(#tilo-front-lav-deep)"/>
    <path d="M32 132 Q20 122 12 112 M32 142 Q20 134 13 124 M208 132 Q220 122 228 112 M208 142 Q220 134 227 124" fill="none" stroke="#7a6c95" stroke-width="2" opacity=".55"/>

    <!-- capa inferior, con dos pliegues de mapa -->
    <rect x="30" y="114" width="180" height="50" rx="24" fill="url(#tilo-front-lav-deep)"/>
    <path d="M90 124 V156 M150 124 V156" stroke="#7a6c95" stroke-width="2" opacity=".55"/>

    <!-- brazos cortos -->
    <path d="M50 90 C37 92 26 104 27 116 C28 124 37 124 40 117 C43 110 47 105 52 103 Z" fill="url(#tilo-front-lav)"/>
    <path d="M190 90 C203 92 214 104 213 116 C212 124 203 124 200 117 C197 110 193 105 188 103 Z" fill="url(#tilo-front-lav)"/>

    <!-- capa media, marfil -->
    <rect x="42" y="84" width="156" height="44" rx="21" fill="url(#tilo-front-ivory)"/>

    <!-- capa superior, la cara -->
    <rect x="54" y="28" width="132" height="70" rx="30" fill="url(#tilo-front-lav)"/>
  </g>

  <!-- brillo mate, sin filtros -->
  <ellipse cx="90" cy="41" rx="22" ry="6" fill="#ffffff" opacity=".22"/>

  <!-- detalle cian: dos curvas de nivel finas, trazo sin relleno; nada que parezca una luz -->
  <path d="M160 102 q5 -4 10 0 t10 0 M164 110 q4 -3 8 0 t8 0" fill="none" stroke="#3fb0c6" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- mejillas -->
  <ellipse cx="83" cy="80" rx="8" ry="4.5" fill="#dba8c2" opacity=".55"/>
  <ellipse cx="157" cy="80" rx="8" ry="4.5" fill="#dba8c2" opacity=".55"/>

  <!-- ojos del mismo tamaño, abiertos y amables -->
  <g stroke="#4b3f60" stroke-width="2.5">
    <ellipse cx="102" cy="62" rx="11.5" ry="13" fill="#fffaf2"/>
    <ellipse cx="138" cy="62" rx="11.5" ry="13" fill="#fffaf2"/>
  </g>
  <circle cx="102.5" cy="63.5" r="7" fill="#2f2839"/>
  <circle cx="138.5" cy="63.5" r="7" fill="#2f2839"/>
  <circle cx="105.5" cy="60.5" r="2.6" fill="#ffffff"/>
  <circle cx="141.5" cy="60.5" r="2.6" fill="#ffffff"/>
  <circle cx="100" cy="66.5" r="1.1" fill="#ffffff" opacity=".8"/>
  <circle cx="136" cy="66.5" r="1.1" fill="#ffffff" opacity=".8"/>

  <!-- sonrisa tranquila -->
  <path d="M110 82 Q120 90 130 82" fill="none" stroke="#4b3f60" stroke-width="2.8" stroke-linecap="round"/>
</svg>
