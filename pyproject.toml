[project]
name = "rangyuu"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rangyuu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
